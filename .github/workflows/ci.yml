name: CI Pipeline

on:
  push:
    branches: [ '**' ]
  pull_request:

permissions:
  contents: read

jobs:
  # Stage 1: Fetch - collect the latest code
  fetch:
    name: 1. Fetch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Share the source with later stages
        uses: actions/upload-artifact@v7
        with:
          name: source-code
          path: |
            pom.xml
            src/
          retention-days: 1
          if-no-files-found: error

  # Stage 2: Compile - turn code into a runnable form
  compile:
    name: 2. Compile
    needs: fetch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source-code
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile
        run: mvn -B -ntp compile

  # Stage 3: Test - run the automated checks
  test:
    name: 3. Test
    needs: compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source-code
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit tests
        run: mvn -B -ntp test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_number }}
          path: target/surefire-reports/
          retention-days: 14

  # Stage 4: Package - assemble one installable file
  package:
    name: 4. Package
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source-code
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build JAR
        run: mvn -B -ntp package -DskipTests
      - name: Hand the JAR to the Publish stage
        uses: actions/upload-artifact@v7
        with:
          name: jar-staging
          path: target/hello-world.jar
          retention-days: 1
          if-no-files-found: error

  # Stage 5: Publish - store the file for later use
  publish:
    name: 5. Publish
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jar-staging
      - name: Smoke test the JAR
        run: java -jar hello-world.jar CI
      - name: Store the JAR
        uses: actions/upload-artifact@v7
        with:
          name: hello-world-jar-${{ github.run_number }}
          path: hello-world.jar
          retention-days: 30
          if-no-files-found: error