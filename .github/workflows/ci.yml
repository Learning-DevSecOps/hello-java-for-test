name: CI Pipeline

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Stage 1: does the code compile?
  build:
    name: 1. Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile
        run: mvn -B -ntp compile

  # Stage 2: do the unit tests pass?
  test:
    name: 2. Unit Test
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit tests
        run: mvn -B -ntp test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 14

  # Stage 3: build the deployable JAR (only runs if tests passed)
  package:
    name: 3. Package
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build JAR
        run: mvn -B -ntp package -DskipTests
      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: hello-world-jar
          path: target/hello-world.jar
          if-no-files-found: error
          retention-days: 30

  # Stage 4: deploy to the dev environment (not on pull requests)
  deploy-dev:
    name: 4. Deploy to Dev
    needs: package
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: dev
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: hello-world-jar
      - name: Deploy (simulated) and smoke test
        run: |
          echo "Deploying hello-world.jar to DEV from ${{ github.ref_name }}..."
          java -jar hello-world.jar Dev

  # Stage 5: release to production (tags only, needs manual approval)
  deploy-prod:
    name: 5. Deploy to Production
    needs: deploy-dev
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: hello-world-jar
      - name: Deploy (simulated) and smoke test
        run: |
          echo "Deploying hello-world.jar to PRODUCTION..."
          java -jar hello-world.jar Production
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" hello-world.jar \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes