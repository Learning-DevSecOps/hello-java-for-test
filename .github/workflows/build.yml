name: Build Hello World JAR

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile
        run: |
          mkdir -p out
          javac -d out src/HelloWorld.java

      - name: Package JAR
        run: |
          jar --create --file hello-world.jar --main-class HelloWorld -C out .

      - name: Run the JAR (smoke test)
        run: java -jar hello-world.jar

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-world-jar
          path: hello-world.jar
          if-no-files-found: error
          retention-days: 30
